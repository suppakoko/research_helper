# CI for research_helper — P0-T14, following docs/13 §5.1.
#
# Deliberate deviations from the docs/13 §5.1 listing, each with its source:
#
# - `on.push` runs on every branch, not only `main`. The P0-T14 card's goal is
#   "runs on push and PR" and its first acceptance criterion is "a push to a
#   branch produces a green lint, unit and build run"; a `main`-only filter
#   would produce no run at all for a `phase-N/<task-id>` branch. `branches`
#   (rather than no filter) keeps tag pushes out, which belong to release.yml.
# - NODE_VERSION is the range "^22.13.0", not "22": the card says Node 22 and
#   package.json's `engines.node` says ">=22.13"; the range is exactly the
#   intersection of the two.
# - The contract-test step and the localization-completeness step were
#   commented placeholders (card steps 3 and 6): their inputs did not exist in
#   Phase 0. Both are steps now (2026-10-07 and P7-T02, 2026-11-17).
# - The `integration` job blocks pull requests since 2026-10-20 (docs/13
#   §5.1; it was `continue-on-error` until V-5 settled and P2-T37 made the
#   suite green), provisions a pinned Zotero release and
#   sets ZOTERO_PLUGIN_ZOTERO_BIN_PATH (card step 5, P0-T13 findings), runs on
#   ubuntu-24.04 rather than ubuntu-latest, and carries a timeout. Reasons are
#   next to each of those lines.
#
# No credential of any kind is referenced in this file, and none may be (card
# P0-T14, "Do NOT"): CI stays credential-free in Phase 0.
#
# P7-T21 (2026-11-17, plan/10): every `uses:` is pinned to the full commit its
# tag pointed at when read with `git ls-remote --tags` that day, the tag kept
# as a comment; permissions are granted per job (`contents: read` each) and
# none at the top; the lint job runs `npm audit --omit=dev --audit-level=high`
# (docs/09 §7's supply-chain lines). test/unit/scripts/releaseWorkflow.test.ts
# holds these rules for this file, release.yml and compat.yml.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  # Card: "Node 22". package.json: engines.node ">=22.13". Both hold for any
  # version this range resolves to.
  NODE_VERSION: "^22.13.0"

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint and Prettier
        run: npm run lint:check

      - name: TypeScript typecheck
        run: npm run typecheck

      # P7-T21: the runtime dependencies' known advisories, high and above.
      # Reads the public npm advisory database; sends the lockfile's package
      # names and versions, nothing of the user's.
      - name: Audit runtime dependencies (P7-T21)
        run: npm audit --omit=dev --audit-level=high

      # P2-T15 — the plugin ships no OpenAlex surface. OpenAlex is out of v1
      # (docs/02 §9.3, on the authority of docs/00 §3 D2 and docs/10 §4 item
      # 10; the record is plan/decisions/D-P2-openalex.md). The step fails on
      # any of: a path named after the source under src/, addon/ or test/; a
      # code line in src/ or addon/ that names it; the host name on a code
      # line anywhere in src/ or addon/. It deliberately allows what docs/07
      # §5.1 reserves on purpose — the `openalex` SourceId member, the
      # `OpenAlexId` brand and the `ExternalIds.openAlexId` slot in
      # src/model/ids.ts, and docs/02 §10.4's inert precedence entries, which
      # land in src/model/merge.ts — plus the one display-name row that
      # Record<SourceId, string> forces on src/zotero/itemMapper.ts. Comment
      # lines are skipped because addon/prefs.js and
      # src/core/rateLimit/hostLimiter.ts record the exclusion in their own
      # comments; the word alone is not a surface. schema/provenance.schema.json
      # mirrors the union and is not scanned. Measured 2026-10-13: a sources
      # member, an openalex.keyPresent row, a SecretId, a policy row, an adapter
      # directory, a fixture directory and a registration slot were each
      # reintroduced in turn and each failed this step (the decision record
      # lists them). Runs from the repository root; RH_GUARD_ROOT points it at
      # another checkout.
      - name: Assert no OpenAlex surface ships (P2-T15)
        run: |
          set -euo pipefail
          cd "${RH_GUARD_ROOT:-.}"
          fail=0
          comment='^[^:]+:[0-9]+:[[:space:]]*(//|/\*|\*)'

          # 1. No file or directory is named after the source. Catches an adapter
          #    directory (docs/07 §11.1 step 1) and a fixture set (step 5) alike.
          paths="$(find src addon test -ipath '*openalex*' | LC_ALL=C sort || true)"
          if [ -n "$paths" ]; then
            echo "::error::OpenAlex adapter or fixture path exists — OpenAlex is out of v1 (P2-T15, docs/02 §9.3)"
            echo "$paths"
            fail=1
          fi

          # 2. No code line in src/ or addon/ names the source. Comment lines are
          #    skipped because the code's own comments record the exclusion. Allowed:
          #    src/model/ (the reserved SourceId member, the OpenAlexId brand, the
          #    ExternalIds.openAlexId slot — docs/07 §5.1 — and docs/02 §10.4's inert
          #    precedence entries) and itemMapper's display-name row, which
          #    Record<SourceId, string> makes mandatory.
          hits="$(grep -rniE 'openalex' src addon \
            | grep -vE "$comment" \
            | grep -vE '^src/model/' \
            | grep -vE '^src/zotero/itemMapper\.ts:[0-9]+:[[:space:]]*openalex: "OpenAlex",$' \
            || true)"
          if [ -n "$hits" ]; then
            while IFS= read -r hit; do
              case "$hit" in
                src/sources/*) what="adapter code" ;;
                src/prefs/*|addon/prefs.js:*) what="preference row or sources member" ;;
                src/core/secretStore.ts:*|src/zotero/keychain.ts:*) what="SecretId" ;;
                src/core/rateLimit/*) what="rate-limit policy row" ;;
                src/bootstrap/registerSources.ts:*) what="source registration" ;;
                *) what="OpenAlex surface" ;;
              esac
              echo "::error::${what} — OpenAlex is out of v1 (P2-T15, docs/02 §9.3): ${hit}"
            done <<< "$hits"
            fail=1
          fi

          # 3. The host name on a code line fails everywhere, allowlist or not: a
          #    policy row (docs/07 §7.3) and an endpoint both need it.
          hosts="$(grep -rniE 'openalex\.org' src addon | grep -vE "$comment" || true)"
          if [ -n "$hosts" ]; then
            echo "::error::api.openalex.org / openalex.org on a code line — OpenAlex is out of v1 (P2-T15, docs/07 §7.3)"
            echo "$hosts"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "Reversing this needs a dated decision record and the three document rows first: plan/decisions/D-P2-openalex.md."
            exit 1
          fi
          echo "No OpenAlex surface: no path, no code line, no host name (reserved SourceId member allowed)."

      # P7-T02 (2026-11-17): the placeholder P0-T14 step 6 left here is now a
      # blocking step, as docs/11 R-22 planned (warn-only until Phase 7, then
      # an error). scripts/check-l10n.mjs compares every en-US bundle with its
      # ko-KR twin: messages, attributes and values present on one side only,
      # and empty values, each printed with its file. It never compares the
      # text. No exception list: an id the owner decides to keep out of ko-KR
      # on purpose is passed here with `--allow <id>`, visibly, and a stale
      # `--allow` fails. No network, no credential.
      # The `--allow rh-error-policy` P7-T12 passed here (plan/00 §6 item
      # 389(c)) was removed on 2026-11-17, when the owner approved its Korean
      # (G-41, item 389(b)) and the stale-allow rule would have failed the step.
      # The 50 `--allow`s P7-T08, P7-T09, P7-T17 and P7-T13 passed here were removed on
      # 2026-11-17, when the owner approved their Korean (G-41, plan/00 §6 item 394).
      # The 20 `--allow`s P7-T10 and P7-T11 passed here were removed on 2026-11-17,
      # when the owner approved their Korean (G-41, plan/00 §6 item 397). A new id
      # whose Korean is only drafted is passed here with `--allow <id>` until its
      # adoption, or the step fails; none is pending today.
      - name: Verify Korean localization completeness (P7-T02)
        run: npm run l10n:check

  unit:
    name: Unit and contract tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npx vitest run --dir test/unit --coverage

      # Restored 2026-10-07, on the condition the placeholder itself named.
      # P0-T14 step 3 left this commented out because test/contract/ was empty
      # and `vitest run` exits 1 on an empty directory (docs/13 §1.6), with the
      # instruction "Restore when the first contract spec lands". P1-T11 landed
      # it: test/contract/pubmed.contract.test.ts, 28 tests over 17 recorded
      # fixtures, which were protecting nothing on a pull request until now.
      #
      # The placeholder's `env: FIXTURE_MODE: replay` is deliberately NOT
      # restored. Measured 2026-10-07: `replay` is not a mode anything
      # recognises — scripts/record-fixtures.ts reads `record` and `synthetic`
      # and treats everything else as a dry run, and the three FIXTURE_MODE
      # mentions under test/contract/ are all inside message text telling a
      # reader how to re-record. Nothing reads the variable to change
      # behaviour, so setting it here would only invite a future reader to
      # believe a replay mode exists.
      #
      # No network is reachable from this step regardless: _transport.ts has no
      # fetch and no XMLHttpRequest, and its only I/O is reading the fixture
      # directory. `--passWithNoTests` is deliberately omitted so that a
      # deleted or renamed spec fails here instead of passing silently.
      - name: Run contract tests (replay from fixtures, no network)
        run: npx vitest run --dir test/contract

      # P2-T16 step 4 — docs/10 NFR-2: a 4-source search at 100 results a
      # source completes in ≤ 30 s. scripts/bench-search.ts runs the shipped
      # pipeline, adapters, client and §7.3 per-host buckets on the real clock
      # over a replay transport that waits a per-host latency measured from the
      # committed fixtures' response date headers (the model is in the
      # script's header). It exits 1 over 30 s, and also when the latency
      # model did not run — a zero-latency replay proves nothing about the
      # budget. No network: every answer is built from committed fixtures and
      # the global fetch is replaced by a function that throws.
      - name: NFR-2 search bench (replay with modelled latency, no network)
        run: npm run bench:search

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  build:
    name: Build XPI
    runs-on: ubuntu-latest
    needs: [lint, unit]
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Assert XPI was produced
        run: |
          set -euo pipefail
          xpi="$(find .scaffold/build -name '*.xpi' -print -quit)"
          if [ -z "$xpi" ]; then
            echo "::error::No XPI produced by the build"
            exit 1
          fi
          echo "Built: $xpi ($(du -h "$xpi" | cut -f1))"
          # NFR-18: bundle size ceiling of 3 MB
          size_bytes="$(stat -c%s "$xpi")"
          if [ "$size_bytes" -gt 3145728 ]; then
            echo "::error::XPI exceeds the 3 MB budget (NFR-18): ${size_bytes} bytes"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: research-helper-xpi
          path: .scaffold/build/*.xpi
          retention-days: 14

  integration:
    name: In-Zotero integration tests
    # docs/13 §2.3 and the P0-T14 card: the scaffold's headless support covers
    # Ubuntu 22.04/24.04 only, and scaffold 0.9.2 installs Zotero's extra
    # runtime libraries only when /etc/os-release's VERSION_ID contains "24".
    # Pinned so that a future ubuntu-latest image cannot silently skip them.
    runs-on: ubuntu-24.04
    needs: [build]
    permissions:
      contents: read
    # docs/13 §5.1, decided 2026-10-20 (plan/00 §6 item 236(e)): V-5 is settled
    # and the suite is green after P2-T37, so a red in-Zotero run now blocks a
    # pull request. The suite is load-sensitive; re-run a red run once before
    # treating it as a regression.
    # P0-T13 saw the scaffold miss Zotero's exit and hang for over five
    # minutes; without a limit a hang would hold the runner for six hours.
    timeout-minutes: 20
    env:
      # Pinned to the Zotero release the developer machine runs (P0-T13 found
      # 10.0.2; the machine has run 10.0.3 since 2026-10-07). Left unset,
      # scaffold 0.9.2 downloads the latest *beta* build on every run instead.
      ZOTERO_VERSION: "10.0.3"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # P0-T13 finding: on CI the scaffold's test runner provisions Zotero
      # itself only when ZOTERO_PLUGIN_ZOTERO_BIN_PATH is unset, and then it
      # fetches the latest beta. Setting the variable skips only that download;
      # the runner still apt-installs Xvfb and starts it, because
      # ZOTERO_SETUP_COMPLETE is deliberately left unset.
      - name: Provision Zotero ${{ env.ZOTERO_VERSION }} (Linux x86_64)
        run: |
          set -euo pipefail
          url="https://download.zotero.org/client/release/${ZOTERO_VERSION}/Zotero-${ZOTERO_VERSION}_linux-x86_64.tar.xz"
          dir="${RUNNER_TEMP}/zotero"
          mkdir -p "$dir"
          curl --fail --silent --show-error --location --retry 3 "$url" -o "${RUNNER_TEMP}/zotero.tar.xz"
          tar -xJf "${RUNNER_TEMP}/zotero.tar.xz" -C "$dir"
          bin="$(find "$dir" -maxdepth 2 -type f -name zotero -perm -u+x -print -quit)"
          if [ -z "$bin" ]; then
            echo "::error::No zotero executable found in the ${ZOTERO_VERSION} tarball"
            exit 1
          fi
          echo "Zotero binary: $bin"
          echo "ZOTERO_PLUGIN_ZOTERO_BIN_PATH=$bin" >> "$GITHUB_ENV"

      # P2-T16 Part A: Phase 2's end-to-end run (the seven-source search, the
      # 500 + 429 partial fetch, FR-51's re-run, and a restart with `sources`
      # excluding semanticscholar) is an in-Zotero spec, collected by the
      # runner's `test.entries` like every other. Checked by name here so a
      # rename or deletion fails loudly rather than shrinking the run. While
      # this job blocks pull requests (2026-10-20), a red run of that spec does
      # too.
      - name: Assert the Phase 2 end-to-end spec is present (P2-T16)
        run: test -f test/integration/pipeline/searchImportMultiSource.spec.ts

      # Needs network: the runner fetches mocha.js from cdn.jsdelivr.net and
      # chai.js from www.chaijs.com, unpinned, at run time (P0-T13).
      - name: Run in-Zotero tests (headless)
        run: npm run test:integration -- --exit-on-finish --abort-on-fail

      # Kept as docs/13 §5.1 lists it. Note (P0-T13): a test run inherits
      # server.devtools but not server.debugOutputFile, so this path may be
      # empty and the upload then only warns.
      - name: Upload Zotero debug logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zotero-logs
          path: .scaffold/logs/
          retention-days: 7
