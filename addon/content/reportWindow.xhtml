<?xml version="1.0"?>
<!--
  The report window (P4-T19; FR-53, part of FR-28; docs/08 §6.4 and its note
  of 2026-10-29).

  Opened by src/ui/panes/reportWindow.ts's openReportWindow, from the
  collection menu's "Generate Research Trends Report…". Modeless: a report run
  takes minutes, and nothing here is modal.

  Shape copied from docs/08 §4.1.1 (Zotero's own createParentDialog.xhtml,
  abridged), as searchDialog.xhtml does: `<window>` outside, `<dialog>` inside,
  the XUL `<tooltip>` element, the `<linkset>` naming THIS window's own bundle
  (docs/08 §10.1: a window owns its bundle), every script from a chrome://
  path, no inline script, no width/height attributes.

  What P4-T19 builds is the shell: the collection line, the per-run language
  selector, the resolved report model as text and Close. P4-T20 adds the run:
  the start button, the stage rows, the streamed preview, Cancel and the
  delivery buttons, driven through the privileged side
  (src/bootstrap/registerUI.ts), never inside this document.

  No literal human-readable string: every visible string is a data-l10n-id
  resolved from research-helper-reportWindow.ftl. The window title and the
  dialog's Close label are XUL attributes set from Fluent by reportWindow.js.
-->
<?xml-stylesheet href="chrome://global/skin/" type="text/css"?> <?xml-stylesheet
href="chrome://zotero/skin/zotero.css" type="text/css"?> <?xml-stylesheet
href="chrome://zotero-platform/content/zotero.css"?>
<window
  id="rh-report-window"
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  tooltip="html-tooltip"
  onload="RHReportWindow.init()"
>
  <tooltip id="html-tooltip" page="true" />
  <dialog
    id="rh-report-dialog"
    orient="vertical"
    buttons="cancel"
    style="padding: 12px; min-width: 40em"
  >
    <script src="chrome://global/content/globalOverlay.js" />
    <script src="chrome://zotero/content/include.js" />
    <script src="chrome://__addonRef__/content/reportWindow.js" />
    <linkset>
      <html:link rel="localization" href="__addonRef__-reportWindow.ftl" />
    </linkset>

    <!-- docs/08 §6.4: the collection and its paper count. -->
    <html:p id="rh-report-collection" hidden="hidden" />

    <!-- The per-run language override (docs/08 §6.4, §10.4), starting on
         reportLanguage. The values are docs/07 §8.5's; never written back. -->
    <hbox align="center">
      <label
        id="rh-report-language-label"
        control="rh-report-language"
        data-l10n-id="research-helper-report-language-label"
      />
      <menulist id="rh-report-language">
        <menupopup>
          <menuitem
            value="auto"
            data-l10n-id="research-helper-report-language-auto"
          />
          <menuitem
            value="en"
            data-l10n-id="research-helper-report-language-en"
          />
          <menuitem
            value="ko"
            data-l10n-id="research-helper-report-language-ko"
          />
          <menuitem
            value="both"
            data-l10n-id="research-helper-report-language-both"
          />
        </menupopup>
      </menulist>
    </hbox>

    <!-- The resolved report model as text, no dropdown and no Depth control
         (owner, 2026-10-26, plan/00 §6 item 286). -->
    <html:p id="rh-report-model" />
  </dialog>
</window>
