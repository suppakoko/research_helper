<!--
  The Research Helper preference pane — a FRAGMENT (P1-T44).

  Loaded by Zotero.PreferencePanes.register (docs/01 §7.3, docs/08 §7.1): no
  <!DOCTYPE>, no <html> wrapper, XUL as the default namespace and HTML under
  `html:`. Zotero parses it with MozXULElement.parseXULToFragment, inserts it
  into the preferences window, translates it with the window's document.l10n,
  then dispatches a non-bubbling `load` event on this root. content/preferences.js
  catches that event with a capturing listener on `document` and initialises —
  there is no inline handler here, because a pane script runs in an isolated
  sandbox (Zotero 8+) and an inline `onload="X.init()"` would resolve X in the
  window's scope, not the script's.

  Scope: the storage block, the LLM providers block (P3-T04: the provider
  choice, one block per provider with its key, model and base URL, and the
  Gemini paid-tier declaration) and the TWO literature-source credential
  blocks; P7-T08 (2026-11-17) added the Search, Report & audio and Privacy
  groups, and P7-T09 (the same day) the Advanced group's settings, usage,
  verbose logging and data location. Spend ceilings, the clear actions
  (P7-T10), diagnostics (P7-T13) and the general contact address
  (`contactEmail`) are other cards'.

  `preference=` bindings (P3-T04): only non-secret rows of docs/07 §8.5 —
  `llmProvider`, each `<provider>.model` and `gemini.paidTier`, and P7-T08's
  ten and P7-T09's three (PANE_BOUND_SETTINGS in
  src/ui/prefs/preferencesPane.ts) — each the
  full key, as docs/08 §7.2 requires. The base-URL inputs are NOT bound:
  Zotero's binding writes every keystroke and cannot refuse a value, and
  docs/03 §14.4 requires validation at write time, so preferences.js writes
  them through the host (docs/08 §7.3, note dated 2026-10-23). The model
  fields are inputs, not editable menulists, for the reason that note gives.
  The provider names in the menulist are literal `label`s, as docs/08 §7.3
  draws them: they are never translated (docs/08 §10.3), and the unit test
  asserts each equals its `research-helper-provider-<id>` en-US value.

  docs/09 §1.9's nine rules, as this markup carries them:
    1. every key field is type="password"; the reveal button is hold-to-show
       (pressed = text, released = password), never a toggle;
    2. a stored key is never re-displayed: after a store the field is emptied
       and its placeholder shows the digest the host returned;
    3. a storage-backend badge, painted from `secretBackend` + the platform;
    4. docs/09 §1.8's residual-risk text, verbatim, in five always-visible
       paragraphs — not behind a link, not in a collapsed disclosure;
    5. a per-credential status row with a Test button that reports inline;
    6. a Remove all stored keys button that reports how many were removed;
    7. paste normalisation (trim, strip a leading `Bearer `) in the host;
    8. no copy affordance anywhere, and copy/cut are refused on the key fields;
    9. NO `preference` attribute on any key field — decision D5. The only
       `preference=` binding this pane will ever carry is a non-secret row.

  No literal human-readable string except the four provider names above:
  every other visible string is a `data-l10n-id` resolved from
  research-helper-mainWindow.ftl (see that bundle's header for why this pane
  uses it). `class`, `id` and `data-l10n-id` are all namespaced `rh-` /
  `research-helper-` (Zotero 7 for Developers).
-->
<vbox
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  id="rh-preferences"
>
  <linkset>
    <html:link rel="localization" href="__addonRef__-mainWindow.ftl" />
  </linkset>

  <!-- ============ Stored API keys: badge, residual risk, remove all ============ -->
  <groupbox id="rh-prefs-storage" aria-labelledby="rh-prefs-storage-title">
    <label>
      <html:h2
        id="rh-prefs-storage-title"
        data-l10n-id="research-helper-prefs-storage"
      />
    </label>

    <!-- Rule 3. Painted by preferences.js from the `secretBackend` preference
         and Zotero.isWin / isMac / isLinux; see backendBadge() in
         src/ui/prefs/preferencesPane.ts for the four states and for why Linux
         is "indeterminate" rather than "System keyring". -->
    <html:p id="rh-prefs-backend" class="rh-backend-badge" role="status" />
    <!-- docs/09 §1.9 item 8: shown by preferences.js only when no credential
         holds a key, the plugin database already holds data and the badge
         names an operating-system store (showRestoreNotice). -->
    <html:p
      id="rh-prefs-restore-note"
      class="rh-hint"
      role="status"
      data-l10n-id="research-helper-prefs-restore-note"
      hidden="true"
    />

    <!-- Rule 4. docs/09 §1.8, verbatim. Always visible. Under the tier-2
         ("session") badge, preferences.js swaps paragraph 1 for §1.8's tier-2
         sentence, research-helper-prefs-risk-1-session (2026-10-23, plan/00
         §6 item 274(a)), and paragraph 4 for its tier-2 replacement,
         research-helper-prefs-risk-4-session (2026-10-23, item 275(b)). -->
    <html:p
      id="rh-prefs-risk-1"
      class="rh-hint rh-risk"
      data-l10n-id="research-helper-prefs-risk-1"
    />
    <html:p
      class="rh-hint rh-risk"
      data-l10n-id="research-helper-prefs-risk-2"
    />
    <html:p
      class="rh-hint rh-risk"
      data-l10n-id="research-helper-prefs-risk-3"
    />
    <html:p
      id="rh-prefs-risk-4"
      class="rh-hint rh-risk"
      data-l10n-id="research-helper-prefs-risk-4"
    />
    <html:p
      class="rh-hint rh-risk"
      data-l10n-id="research-helper-prefs-risk-5"
    />

    <!-- Rule 6. -->
    <hbox align="center">
      <button
        id="rh-prefs-remove-all"
        data-l10n-id="research-helper-prefs-remove-all"
      />
    </hbox>
    <html:p id="rh-prefs-remove-all-status" class="rh-hint" role="status" />
  </groupbox>

          id="rh-or-key"
          class="rh-key"
          type="password"
          size="46"
          autocomplete="off"
          spellcheck="false"

        <button id="rh-or-reveal" data-l10n-id="research-helper-prefs-reveal" />

        <button

          data-l10n-id="research-helper-prefs-clear-key"
        />
      </hbox>
      <html:span id="rh-or-backend" class="rh-backend-badge" />
      <html:p id="rh-or-status" class="rh-hint" role="status" />
      <hbox align="center">
        <label
          data-l10n-id="research-helper-prefs-model"
          control="rh-or-model"
        />
        <html:input
          id="rh-or-model"
          class="rh-model"
          type="text"
          size="46"
          autocomplete="off"
          spellcheck="false"
          preference="extensions.zotero.research-helper.openrouter.model"

      </hbox>
      <hbox align="center">
        <label
          data-l10n-id="research-helper-prefs-base-url"
          control="rh-or-base-url"
        />
        <!-- NOT bound: written through the host after checkBaseUrlInput. The
             placeholder is docs/03's documented base URL for this provider. -->
        <html:input
          id="rh-or-base-url"
          class="rh-base-url"
          type="url"
          size="46"
          autocomplete="off"
          spellcheck="false"
          placeholder="https://openrouter.ai/api/v1"
        />
      </hbox>
      <html:p id="rh-or-base-url-status" class="rh-hint" role="status" />
    </vbox>

    <!-- llm.openai. docs/08 §7.5 rule 4: preferences.js shows only the active
         provider's block and keeps the others' stored keys. -->
    <vbox id="rh-provider-openai" class="rh-provider-block">
      <hbox align="center">
        <label
          data-l10n-id="research-helper-prefs-api-key"

          id="rh-openai-key"
          class="rh-key"
          type="password"

        <button

          data-l10n-id="research-helper-prefs-clear-key"

      </hbox>
      <html:span id="rh-openai-backend" class="rh-backend-badge" />
      <html:p id="rh-openai-status" class="rh-hint" role="status" />
      <hbox align="center">
        <label

          autocomplete="off"

      </hbox>
      <html:p id="rh-openai-base-url-status" class="rh-hint" role="status" />
    </vbox>

    <!-- llm.gemini. docs/08 §7.5 rule 4: preferences.js shows only the active
         provider's block and keeps the others' stored keys. -->
    <vbox id="rh-provider-gemini" class="rh-provider-block">
      <hbox align="center">
        <label
          data-l10n-id="research-helper-prefs-api-key"
          control="rh-gemini-key"

        <html:input
          id="rh-gemini-key"
          class="rh-key"
          type="password"

          autocomplete="off"

        <button

      </hbox>
      <html:span id="rh-gemini-backend" class="rh-backend-badge" />
      <html:p id="rh-gemini-status" class="rh-hint" role="status" />
      <hbox align="center">
        <label

        <html:input

    <!-- llm.anthropic. docs/08 §7.5 rule 4: preferences.js shows only the active

    <vbox id="rh-provider-anthropic" class="rh-provider-block">
      <hbox align="center">
        <label
          data-l10n-id="research-helper-prefs-api-key"
          control="rh-anthropic-key"
        />
        <!-- Rules 1, 2, 9: password, digest in the placeholder, NO preference
             attribute. -->
        <html:input
          id="rh-anthropic-key"
          class="rh-key"
          type="password"
          size="46"
          autocomplete="off"
          spellcheck="false"
        />
        <button

          data-l10n-id="research-helper-prefs-reveal"
        />
        <!-- Wired by P3-T14; disabled until then. -->

          data-l10n-id="research-helper-prefs-test-key"
        />
        <button
          id="rh-anthropic-clear"
          data-l10n-id="research-helper-prefs-clear-key"
        />
      </hbox>
      <html:span id="rh-anthropic-backend" class="rh-backend-badge" />
      <html:p id="rh-anthropic-status" class="rh-hint" role="status" />
      <hbox align="center">

          control="rh-anthropic-model"

  <!-- ============ NCBI (PubMed) — SecretId "source.ncbi" ============ -->
  <groupbox id="rh-prefs-ncbi" aria-labelledby="rh-prefs-ncbi-title">
    <label>
      <html:h2
        id="rh-prefs-ncbi-title"
        data-l10n-id="research-helper-prefs-ncbi"
      />
    </label>
    <html:p class="rh-hint" data-l10n-id="research-helper-prefs-ncbi-note" />
    <hbox align="center">
      <label
        data-l10n-id="research-helper-prefs-ncbi-key"
        control="rh-ncbi-key"
      />
      <!-- Rules 1, 2, 9: password, digest in the placeholder, NO preference
           attribute. autocomplete="off" keeps the form manager out. -->
      <html:input
        id="rh-ncbi-key"
        class="rh-key"
        type="password"
        size="40"
        autocomplete="off"
        spellcheck="false"
      />
      <button id="rh-ncbi-reveal" data-l10n-id="research-helper-prefs-reveal" />

      />
    </hbox>
    <html:span id="rh-ncbi-backend" class="rh-backend-badge" />
    <!-- Rule 5. Output, not input: no `preference` attribute. -->
    <html:p id="rh-ncbi-status" class="rh-hint" role="status" />
  </groupbox>

  <!-- ============ Semantic Scholar — SecretId "source.semanticscholar" ============ -->

      <html:input
        id="rh-s2-key"
        class="rh-key"
        type="password"
        size="40"
        autocomplete="off"
        spellcheck="false"
      />
      <button id="rh-s2-reveal" data-l10n-id="research-helper-prefs-reveal" />

    <html:p id="rh-s2-status" class="rh-hint" role="status" />

            <menuitem
              value="ko"
              data-l10n-id="research-helper-prefs-tts-language-option"
              data-l10n-args='{"language":"ko"}'
            />
          </menupopup>
        </menulist>
      </hbox>
      <hbox align="center">
        <label
          data-l10n-id="research-helper-prefs-tts-voice"
          control="rh-voice"
        />
        <!-- Filled by preferences.js from the documented default voice list
             the host returns; no call is made. Each label is a voice's name
             (docs/08 §10.3). -->
        <menulist
          id="rh-voice"
          preference="extensions.zotero.research-helper.tts.voice"
          native="true"
        >
          <menupopup id="rh-voice-popup" />
        </menulist>
      </hbox>
      <html:p
        class="rh-hint"
        data-l10n-id="research-helper-prefs-tts-voice-note"
      />
      <hbox align="center">
        <label
          data-l10n-id="research-helper-prefs-tts-minutes"
          control="rh-tts-minutes"
        />
        <html:input
          id="rh-tts-minutes"
          type="number"
          min="0"
          max="60"
          size="4"
          preference="extensions.zotero.research-helper.tts.targetMinutes"
        />
      </hbox>
      <!-- The folder for linked recordings. NOT bound: a local path, chosen
           with a folder picker and written through the host's
           setLinkedFolder, which checks it first. Shown here only; never
           logged. -->
      <hbox align="center">
        <label
          data-l10n-id="research-helper-prefs-tts-folder"
          control="rh-tts-folder"
        />
        <html:input id="rh-tts-folder" type="text" size="40" readonly="true" />
        <button
          id="rh-tts-folder-choose"
          data-l10n-id="research-helper-prefs-tts-folder-choose"
        />
        <button
          id="rh-tts-folder-clear"
          data-l10n-id="research-helper-prefs-tts-folder-clear"
        />
      </hbox>
      <html:p id="rh-tts-folder-status" class="rh-hint" role="status" />
      <html:p
        class="rh-hint"
        data-l10n-id="research-helper-prefs-tts-folder-note"
      />
    </vbox>
  </groupbox>

  <!-- ============ Privacy (P7-T08; docs/08 §7.3) ============ -->
  <!-- The GLOBAL default only; a collection's own setting can only be
       stricter (docs/09 §3.5). The explanation line is painted from the
       chosen mode and says no more than docs/09 §3.5's table. -->
  <groupbox id="rh-prefs-privacy" aria-labelledby="rh-prefs-privacy-title">
    <label>
      <html:h2
        id="rh-prefs-privacy-title"
        data-l10n-id="research-helper-prefs-privacy"
      />
    </label>
    <hbox align="center">
      <label
        data-l10n-id="research-helper-prefs-privacy-mode"
        control="rh-privacy"
      />
      <menulist
        id="rh-privacy"
        preference="extensions.zotero.research-helper.privacy.mode"
        native="true"
      >
        <menupopup>
          <menuitem
            value="strict"
            data-l10n-id="research-helper-prefs-privacy-option"
            data-l10n-args='{"mode":"strict"}'
          />
          <menuitem
            value="balanced"
            data-l10n-id="research-helper-prefs-privacy-option"
            data-l10n-args='{"mode":"balanced"}'
          />
          <menuitem
            value="full"
            data-l10n-id="research-helper-prefs-privacy-option"
            data-l10n-args='{"mode":"full"}'
          />
        </menupopup>
      </menulist>
    </hbox>
    <html:p id="rh-privacy-explain" class="rh-hint" role="status" />
    <hbox align="center">
      <label
        data-l10n-id="research-helper-prefs-fulltext-mode"
        control="rh-fulltext"
      />
      <menulist
        id="rh-fulltext"
        preference="extensions.zotero.research-helper.summary.fullTextMode"
        native="true"
      >
        <menupopup>
          <menuitem
            value="never"
            data-l10n-id="research-helper-prefs-fulltext-option"
            data-l10n-args='{"mode":"never"}'
          />
          <menuitem
            value="auto"
            data-l10n-id="research-helper-prefs-fulltext-option"
            data-l10n-args='{"mode":"auto"}'
          />
          <menuitem
            value="always"
            data-l10n-id="research-helper-prefs-fulltext-option"
            data-l10n-args='{"mode":"always"}'
          />
        </menupopup>
      </menulist>
    </hbox>
    <html:p
      class="rh-hint"
      data-l10n-id="research-helper-prefs-fulltext-note"
    />
    <!-- P7-T17 (2026-11-17; docs/08 §7.3's note of 2026-11-16, item 3):
         preferences.js fills this with the provider-policy lines the host
         returns (POLICY_NOTES), each with its verification date, and leaves
         it hidden when there is none. -->
    <html:div id="rh-prefs-retention" class="rh-hint" hidden="true" />
  </groupbox>

  <!-- ============ Advanced (P7-T09; docs/08 §7.3) ============ -->
  <!-- The three number fields are bound (PANE_BOUND_SETTINGS.advanced). The
       usage lines, the verbose-logging checkbox and the data location are
       preferences.js's, through the host: the checkbox writes `logLevel`
       ("debug" checked, "warn" unchecked) and nothing else — there is no
       `debug` preference and `logRequestBodies` is not in the pane
       (docs/07 §8.5, Diagnostics). The clear actions are P7-T10's;
       diagnostics are P7-T13's; the stored-data block is P7-T10's. -->
  <groupbox id="rh-prefs-advanced" aria-labelledby="rh-prefs-advanced-title">
    <label>
      <html:h2
        id="rh-prefs-advanced-title"
        data-l10n-id="research-helper-prefs-advanced"
      />
    </label>
    <hbox align="center">
      <label
        data-l10n-id="research-helper-prefs-concurrency"
        control="rh-conc"
      />
      <html:input
        id="rh-conc"
        type="number"
        min="1"
        max="8"
        size="3"
        preference="extensions.zotero.research-helper.concurrency"
      />
    </hbox>
    <hbox align="center">
      <label
        data-l10n-id="research-helper-prefs-timeout"
        control="rh-timeout"
      />
      <html:input
        id="rh-timeout"
        type="number"
        min="10"
        max="600"
        step="10"
        size="4"
        preference="extensions.zotero.research-helper.timeoutSeconds"
      />
    </hbox>
    <hbox align="center">
      <label
        data-l10n-id="research-helper-prefs-cache-size"
        control="rh-cache-size"
      />
      <html:input
        id="rh-cache-size"
        type="number"
        min="100"
        max="5000"
        step="100"
        size="5"
        preference="extensions.zotero.research-helper.cache.maxSizeMB"
      />
    </hbox>
    <!-- The cache's own counts: the total, then one line per namespace
         holding anything. Refreshed on open and after a clear (P7-T10). -->
    <html:div id="rh-cache-breakdown" class="rh-hint" role="status" />
    <checkbox
      id="rh-verbose-logging"
      data-l10n-id="research-helper-prefs-debug"
    />
    <html:p class="rh-hint" data-l10n-id="research-helper-prefs-debug-note" />
    <!-- Where the plugin database lives (docs/09 §3.7, last bullet): shown on
         the user's own screen, never logged, not editable. -->
    <hbox align="center">
      <html:p id="rh-data-location" class="rh-hint" />
      <button
        id="rh-data-location-show"
        data-l10n-id="research-helper-prefs-data-location-show"
      />
    </hbox>
    <!-- P7-T13: diagnostics (docs/07 §10.4, "As built"). The text is shown
         first; Save and Copy are enabled only then, and act on exactly the
         text shown. The host writes the file and fills the clipboard. -->
    <html:h3
      id="rh-diagnostics-title"
      data-l10n-id="research-helper-prefs-diagnostics-title"
    />
    <html:p
      class="rh-hint"
      data-l10n-id="research-helper-prefs-diagnostics-note"
    />
    <hbox align="center">
      <button
        id="rh-diagnostics-preview"
        data-l10n-id="research-helper-prefs-diagnostics-preview"
      />
      <button
        id="rh-diagnostics-save"
        data-l10n-id="research-helper-prefs-diagnostics-save"
        disabled="true"
      />
      <button
        id="rh-diagnostics-copy"
        data-l10n-id="research-helper-prefs-diagnostics-copy"
        disabled="true"
      />
    </hbox>
    <html:textarea
      id="rh-diagnostics-text"
      data-l10n-id="research-helper-prefs-diagnostics-text"
      readonly="true"
      rows="12"
      hidden="true"
    />
    <html:p
      id="rh-diagnostics-status"
      class="rh-hint"
      role="status"
      hidden="true"
    />
    <!-- P7-T10: stored data (docs/09 §3.7). Each button asks first, naming
         what it would remove; the host shows the confirmation and does the
         work, then the cache lines above are read again. None touches a
         Zotero item, a note or an API key. -->
    <html:h3
      id="rh-data-title"
      data-l10n-id="research-helper-prefs-data-title"
    />
    <html:p class="rh-hint" data-l10n-id="research-helper-prefs-data-note" />
    <hbox align="center" wrap="true">
      <button
        id="rh-clear-responses"
        data-l10n-id="research-helper-prefs-clear-responses"
      />
      <button
        id="rh-clear-summaries"
        data-l10n-id="research-helper-prefs-clear-summaries"
      />
      <button
        id="rh-clear-jobs"
        data-l10n-id="research-helper-prefs-clear-jobs"
      />
      <button
        id="rh-clear-embeddings"
        data-l10n-id="research-helper-prefs-clear-embeddings"
      />
    </hbox>
    <hbox align="center" wrap="true">
      <button
        id="rh-delete-all-data"
        data-l10n-id="research-helper-prefs-delete-all-data"
      />
      <button
        id="rh-reset-defaults"
        data-l10n-id="research-helper-prefs-reset-defaults"
      />
    </hbox>
    <!-- P7-T11 (plan/00 §6 item 380, decision 2): the one command that moves
         Zotero items, and only to the trash. The host counts each kind,
         asks, re-checks each item, then deletes the stored data. -->
    <hbox align="center">
      <button
        id="rh-remove-content"
        data-l10n-id="research-helper-prefs-remove-content"
      />
    </hbox>
    <html:p
      class="rh-hint"
      data-l10n-id="research-helper-prefs-remove-content-note"
    />
    <html:p id="rh-data-status" class="rh-hint" role="status" hidden="true" />
  </groupbox>
</vbox>
