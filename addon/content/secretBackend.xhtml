<?xml version="1.0"?>
<!--
  The key-storage degradation dialog (P3-T03; docs/09 §1.7, gate G-10).

  Opened by src/ui/dialogs/secretBackendDialog.ts's openSecretBackendDialog
  when the startup keystore probe fails. It offers session-only storage with
  its cost, or running without stored keys. There is no third option: tier 3,
  the passphrase file, does not ship in v1, and tier 4 is refused by D5.

  Shape copied from searchDialog.xhtml (docs/08 §4.1.1): `<window>` outside,
  `<dialog>` inside, every script from a chrome:// path, no inline script, no
  width/height attributes, and no literal human-readable string. The three
  paragraphs are `data-l10n-id`s; the window title and the two button labels
  are set by secretBackend.js from research-helper-mainWindow.ftl.

  `defaultButton="cancel"`: Enter on an untouched dialog stores nothing.
-->
<?xml-stylesheet href="chrome://global/skin/" type="text/css"?> <?xml-stylesheet
href="chrome://zotero/skin/zotero.css" type="text/css"?> <?xml-stylesheet
href="chrome://zotero-platform/content/zotero.css"?>
<window
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  onload="RHSecretBackendDialog.init()"
>
  <dialog
    id="rh-secret-backend-dialog"
    orient="vertical"
    buttons="accept,cancel"
    defaultButton="cancel"
  >
    <script src="chrome://global/content/globalOverlay.js" />
    <script src="chrome://zotero/content/include.js" />
    <script src="chrome://__addonRef__/content/secretBackend.js" />
    <linkset>
      <html:link rel="localization" href="__addonRef__-mainWindow.ftl" />
    </linkset>

    <html:div style="max-width: 36em">
      <html:p
        id="rh-secret-backend-explain"
        data-l10n-id="research-helper-secret-backend-explain"
      />
      <html:p
        id="rh-secret-backend-session"
        data-l10n-id="research-helper-secret-backend-session"
      />
      <html:p
        id="rh-secret-backend-none"
        data-l10n-id="research-helper-secret-backend-none"
      />
    </html:div>
  </dialog>
</window>
